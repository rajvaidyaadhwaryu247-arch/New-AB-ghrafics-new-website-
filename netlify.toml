# netlify.toml - production deployment settings for AB Graphics Hub

[build]
  command = "npm run build"
  publish = "dist"

# Single Page Application (SPA) redirects - prevent 404 on reload
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache and custom header optimization for premium media assets performance
[[headers]]
  for = "/*"
    [headers.values]
      X-Frame-Options = "DENY"
      X-XSS-Protection = "1; mode=block"
      X-Content-Type-Options = "nosniff"
      Referrer-Policy = "strict-origin-when-cross-origin"
      Cache-Control = "public, max-age=31536000, must-revalidate"
